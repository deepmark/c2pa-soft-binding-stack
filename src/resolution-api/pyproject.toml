[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolution-api"
version = "0.1.0"
description = "C2PA Soft Binding Resolution API (Decoupled spec v2.4) over FastAPI + MongoDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kosta" }]
keywords = ["c2pa", "soft-binding", "resolution", "fastapi", "mongodb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "motor==3.7.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.12",
    "httpx==0.27.0",
    "pyyaml>=6",
    # Used by POST /manifests to extract the canonical active_manifest
    # URN from posted bytes — both ingestion-api and resolution-api
    # derive the same manifestId from the same content, making the
    # store idempotent.
    "c2pa-python==0.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
resolution-api = "resolution_api.__main__:run"
resolution-init-db = "resolution_api.init_db:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008  - FastAPI uses Depends()/File()/Form() in argument defaults.
# B904  - pre-existing in the spec routers; cleanup is out of scope here.
# E501  - pre-existing long lines in the spec routers we haven't rewritten.
ignore = ["B008", "B904", "E501"]

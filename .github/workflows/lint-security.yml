name: Lint and Security

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/lint-security.yml"
      - ".pre-commit-config.yaml"
      - "apps/**"
      - "docker-compose.yml"
      - "mongo-init/**"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/lint-security.yml"
      - ".pre-commit-config.yaml"
      - "apps/**"
      - "docker-compose.yml"
      - "mongo-init/**"

permissions:
  contents: read

concurrency:
  group: lint-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/*/pyproject.toml
            apps/*/uv.lock

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run lint and security checks
        run: pre-commit run --all-files --show-diff-on-failure

# Shared catalog of soft-binding plugins supported by this deployment.
#
# Mounted into both `resolution-api` and `ingestion-api`:
#  - resolution-api reads it for `GET /services/supportedAlgorithms`.
#  - ingestion-api reads it to look up the plugin URL for a given alg
#    when handling `POST /ingest`.
#
# Schema:
#   alg          -- canonical soft-binding algorithm identifier
#   type         -- "watermark" or "fingerprint"
#   bindingBits  -- width of the binding value in bits (any positive int;
#                   not required to be a multiple of 8)
#   mediaTypes   -- IANA media types this plugin can handle
#   url          -- HTTP URL of the plugin container, used by ingestion-api

plugins:
  - alg: me.deepmark.audio.aware.20
    type: watermark
    bindingBits: 20
    mediaTypes:
      - audio/wav
      - audio/wave
      - audio/x-wav
      - audio/mpeg
      - audio/flac
      - audio/x-flac
      - audio/ogg
    url: http://watermark-aware-20:9004

  # Fingerprint plugins go here, e.g.:
  #
  # - alg: org.example.audiofp.v1
  #   type: fingerprint
  #   bindingBits: 128
  #   mediaTypes: ["audio/wav", "audio/mpeg"]
  #   url: http://fingerprint-example:8000

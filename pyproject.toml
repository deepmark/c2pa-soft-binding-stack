[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-binding-api"
version = "0.1.0"
description = "C2PA Soft Binding Resolution API (Decoupled spec v2.4) over FastAPI + MongoDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [
    { name = "Kosta" },
]
keywords = ["c2pa", "soft-binding", "watermark", "fingerprint", "fastapi", "mongodb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "motor==3.7.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-multipart==0.0.12",
    "httpx==0.27.0",
    "c2pa-python==0.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
softbinding-api = "soft_binding_api.__main__:run"
softbinding-init-db = "soft_binding_api.init_db:cli"

[project.urls]
"Spec" = "https://spec.c2pa.org/specifications/specifications/2.4/softbinding/Decoupled.html"
"Algorithm registry" = "https://github.com/c2pa-org/softbinding-algorithm-list"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

services:
  mongo:
    image: mongo:7
    container_name: c2pa-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  resolution-api:
    build:
      context: ./src/resolution-api
    container_name: resolution-api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${RESOLUTION_API_PORT:-8000}:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: c2pa_soft_bindings
      PLUGINS_CATALOG_PATH: /catalog/plugins.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    volumes:
      - ./plugins.yaml:/catalog/plugins.yaml:ro

  ingestion-api:
    build:
      context: ./src/ingestion-api
    container_name: ingestion-api
    restart: unless-stopped
    depends_on:
      - mongo
      - resolution-api
      - watermark-vigil-128
    ports:
      - "${INGESTION_API_PORT:-8001}:8001"
    environment:
      # Ingestion-api owns its own DB on the Mongo cluster. In a real
      # deployment MONGODB_URL can point at a completely separate cluster
      # from resolution-api's; here we share a container in dev.
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: c2pa_ingestions
      PLUGINS_CATALOG_PATH: /catalog/plugins.yaml
      STORAGE_ROOT: /var/lib/ingestion-api/storage
      CREDENTIALS_DIR: /credentials
      SIGNING_ALG: ${SIGNING_ALG:-ES256}
      TA_URL: ${TA_URL:-}
      # Resolution-api auto-push (default ON). Set
      # RESOLUTION_PUSH_ENABLED=false in .env for standalone deployments
      # that don't talk to resolution-api.
      RESOLUTION_PUSH_ENABLED: ${RESOLUTION_PUSH_ENABLED:-true}
      RESOLUTION_API_URL: ${RESOLUTION_API_URL:-http://resolution-api:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    volumes:
      - ./plugins.yaml:/catalog/plugins.yaml:ro
      - ./credentials:/credentials:ro
      - ingestion-storage:/var/lib/ingestion-api/storage

  watermark-vigil-128:
    build:
      context: ./src/plugins/watermark/vigil-128
    container_name: watermark-vigil-128
    restart: unless-stopped
    ports:
      - "${VIGIL_128_PORT:-8101}:8000"

volumes:
  mongo-data:
  ingestion-storage:

exclude: |
  (?x)^(
    apps/.*/\.venv/|
    apps/.*/\.pytest_cache/|
    apps/.*/\.ruff_cache/|
    apps/.*/poetry\.lock|
    apps/.*/uv\.lock
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-ast
      - id: check-docstring-first
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-ingestion-api
        name: ruff ingestion-api
        entry: bash -c 'cd apps/ingestion-api && uv run --extra dev ruff check "${@/#apps\/ingestion-api\//}"' --
        language: system
        files: ^apps/ingestion-api/.*\.py$

      - id: ruff-resolution-api
        name: ruff resolution-api
        entry: bash -c 'cd apps/resolution-api && uv run --extra dev ruff check "${@/#apps\/resolution-api\//}"' --
        language: system
        files: ^apps/resolution-api/.*\.py$

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
        files: ^apps/(ingestion-api|resolution-api)/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-ll"]
        files: ^apps/(ingestion-api|resolution-api)/src/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
